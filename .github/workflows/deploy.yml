name: Build and Deploy Telegram Bot

on:
  push:
    tags:
      - 'v*'

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ id.meta.outputs.tags }}
          labels: ${{ id.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to Server via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script: |
            # Create deployment directory
            mkdir -p /home/${{ secrets.SSH_USER }}/tiktok-downloader-tgbot
            cd /home/${{ secrets.SSH_USER }}/tiktok-downloader-tgbot

            # Write docker-compose.yml
            cat << 'EOF' > docker-compose.yml
            services:
              bot:
                image: ghcr.io/${{ github.repository }}:latest
                container_name: tiktok-downloader-tgbot
                restart: unless-stopped
                env_file:
                  - .env
            EOF

            # Write .env file
            cat << 'EOF' > .env
            BOT_TOKEN=${{ secrets.BOT_TOKEN }}
            EOF

            # Login to GHCR to pull the private/public image
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            # Pull and restart using docker compose (supporting both v1 and v2 CLI)
            if docker compose version >/dev/null 2>&1; then
              docker compose pull
              docker compose up -d --remove-orphans
            else
              docker-compose pull
              docker-compose up -d --remove-orphans
            fi

            # Logout from GHCR
            docker logout ghcr.io
